name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Wrapper and Build APK
        run: |
          # Navigate to android folder if it exists
          if [ -d "android" ]; then cd android; fi

          # Generate Gradle wrapper if missing from the repository
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1-testing
          name: "PhoneCluster Node v0.1-testing"
          draft: false
          prerelease: false
          files: '**/build/outputs/apk/debug/*.apk'
