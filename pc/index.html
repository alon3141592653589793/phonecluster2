<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PhoneClusterApp - Node Console</title>
<style>
  :root { --bg:#0f1012; --panel:#17181b; --line:#26282c; --ink:#e8e6e1; --dim:#8a8a86; --ok:#6fcf97; --bad:#eb5757; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; letter-spacing:.02em; }
  #status { font:12px ui-monospace,monospace; color:var(--dim); }
  #status.ok { color:var(--ok); }
  #status.bad { color:var(--bad); }
  #log { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:720px; padding:10px 14px; border-radius:10px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#2a2c31; }
  .bot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  form { display:flex; gap:8px; padding:16px 20px; border-top:1px solid var(--line); }
  input { flex:1; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:12px 14px; border-radius:10px; font:inherit; }
  button { background:var(--ink); color:var(--bg); border:0; padding:0 18px; border-radius:10px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; }
</style>
</head>
<body>
<header><h1>USB AI Compute Node</h1><span id="status">checking...</span></header>
<div id="log"></div>
<form id="form">
  <input id="prompt" placeholder="Send a prompt to the phone..." autocomplete="off" />
  <button id="send">Send</button>
</form>
<script>
  const API = "http://localhost:8080";
  const log = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const input = document.getElementById("prompt");
  const send = document.getElementById("send");

  function add(text, cls) {
    const el = document.createElement("div");
    el.className = "msg " + cls;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  async function checkHealth() {
    try {
      const r = await fetch(API + "/health");
      statusEl.textContent = r.ok ? "node online" : "node error " + r.status;
      statusEl.className = r.ok ? "ok" : "bad";
    } catch (e) {
      statusEl.textContent = "offline - run connect_phone.bat";
      statusEl.className = "bad";
    }
  }

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const prompt = input.value.trim();
    if (!prompt) return;
    input.value = "";
    add(prompt, "user");
    const bot = add("...", "bot");
    send.disabled = true;
    try {
      const r = await fetch(API + "/completion", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt: prompt, n_predict: 256 })
      });
      const data = await r.json();
      bot.textContent = data.content || JSON.stringify(data);
    } catch (err) {
      bot.textContent = "Request failed: " + err.message;
    }
    send.disabled = false;
  });

  checkHealth();
  setInterval(checkHealth, 5000);
</script>
</body>
</html>
